[project]
name = "rag-from-scratch"
version = "0.1.0"
description = "A minimal RAG built from scratch over a QKD explainer, using local Ollama models."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "requests",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
